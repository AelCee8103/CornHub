<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .signup-container {
      background-color: purple;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    
    .signup-container h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    
    .signup-container input[type="email"],
    .signup-container input[type="text"],
    .signup-container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: none;
      border-radius: 5px;
      background-color: gold;
      color: black;
    }
    
    .signup-container input[type="submit"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: gold;
      color: black;
      cursor: pointer;
    }
    
    .signup-container input[type="submit"]:hover {
      background-color: white;
      color: black;
    }
    
    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Create an Account</h2>
    <form id="signupForm" action="" method="POST" onsubmit="return sendFormData()">
      <input type="email" name="email" id="email" placeholder="Email" required><br>
      <input type="text" name="username" id="username" placeholder="Username" required><br>
      <input type="password" name="password" id="password" placeholder="Password (6-12 characters)" required><br>
      <input type="submit" value="Create Account">
    </form>
    <div id="error-msg" class="error-message"></div>
  </div>

  <script>
    function sendFormData() {
      var email = document.getElementById("email").value;
      var username = document.getElementById("username").value;
      var password = document.getElementById("password").value;
      var errorMsg = document.getElementById("error-msg");
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
   
      if (!emailRegex.test(email)) {
        errorMsg.innerHTML = "Please enter a valid email address.";
        return false;
      } else if (username.length === 0 || password.length === 0) {
        errorMsg.innerHTML = "All fields are required.";
        return false;
      } else if (password.length < 6 || password.length > 12) {
        errorMsg.innerHTML = "Password must be 6-12 characters long.";
        return false;
      } else {
        // Creating an AJAX request
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "create_account.php", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4 && xhr.status === 200) {
            // Handle the response from create_account.php
            alert(xhr.responseText);
          }
        };
        // Sending the form data
        xhr.send("email=" + email + "&username=" + username + "&password=" + password);
        return false; // Preventing the form from submitting normally
      }
    }
  </script>
</body>
</html>
